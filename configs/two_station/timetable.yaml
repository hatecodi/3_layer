time_base: "00:00:00"
time_unit: seconds_after_midnight

priority_map:
  G: 1
  D: 1
  C: 1
  Z: 2
  T: 2
  K: 3

station_dwell_defaults:
  A: 60
  B: 30

time_generation:
  corridor_runtime_sec:
    A_to_B: 90
    B_to_A: 90
  dep_max_slack_sec: 120
  headway_sec:
    A_to_B: 60
    B_to_A: 60

assumptions:
  - All dimensions scaled from real to training per trains reference.
  - Corridor 1200m at 30m/s (~40s) + throat/platform at 15-20m/s (~50s) ≈ 90s one-way.
  - A dwell 60s, B dwell 30s, K641 special A 120s.
  - G5050 is pass-through (dwell=0 at both stations).
  - dep_max = dep_plan + dep_max_slack_sec (120s).

trains:
  # ==================== UP: A -> B ====================

  - id: K641
    direction: up
    train_class: K
    priority: 3
    pass_through: false
    route:
      origin_station: A
      destination_station: B
      corridor: A_B_up
    planned:
      A:
        arr: -120
        dep: 0
      B:
        arr: 90
        dep: 120
    bounds:
      A:
        arr_min: -120
        dep_max: 240        # >= 30 + 20(throat) + 120(dwell) + 20(throat) = 190
        dwell_min: 120      # K641 special: long dwell at A
      B:
        arr_min: 90
        dep_max: 240
        dwell_min: 30
    candidate_platforms:
      A: [A_p1, A_p2, A_p3]
      B: [B_p1, B_p2, B_p3]

  - id: D133
    direction: up
    train_class: D
    priority: 1
    pass_through: false
    route:
      origin_station: A
      destination_station: B
      corridor: A_B_up
    planned:
      A:
        arr: 60          # 120 - 60 dwell
        dep: 120
      B:
        arr: 210
        dep: 240         # 210 + 30 dwell B
    bounds:
      A:
        arr_min: 60
        dep_max: 240
        dwell_min: 60
      B:
        arr_min: 210
        dep_max: 360
        dwell_min: 30
    candidate_platforms:
      A: [A_p1, A_p2, A_p3]
      B: [B_p1, B_p2, B_p3]

  - id: G5050
    direction: up
    train_class: G
    priority: 1
    pass_through: true
    route:
      origin_station: A
      destination_station: B
      corridor: A_B_up
    planned:
      A:
        arr: 180
        dep: 180
      B:
        arr: 270
        dep: 270
    bounds:
      A:
        arr_min: 180
        dep_max: 300
        dwell_min: 0
      B:
        arr_min: 270
        dep_max: 390
        dwell_min: 0
    candidate_platforms:
      A: [A_p1, A_p2, A_p3]
      B: [B_p1, B_p2, B_p3]

  - id: K667
    direction: up
    train_class: K
    priority: 3
    pass_through: false
    route:
      origin_station: A
      destination_station: B
      corridor: A_B_up
    planned:
      A:
        arr: 240
        dep: 300
      B:
        arr: 390
        dep: 420
    bounds:
      A:
        arr_min: 240
        dep_max: 420
        dwell_min: 60
      B:
        arr_min: 390
        dep_max: 540
        dwell_min: 30
    candidate_platforms:
      A: [A_p1, A_p2, A_p3]
      B: [B_p1, B_p2, B_p3]

  # ==================== DOWN: B -> A ====================

  - id: G1408
    direction: down
    train_class: G
    priority: 1
    pass_through: false
    route:
      origin_station: B
      destination_station: A
      corridor: B_A_down
    planned:
      B:
        arr: 60
        dep: 90
      A:
        arr: 180
        dep: 240
    bounds:
      B:
        arr_min: 60
        dep_max: 210
        dwell_min: 30
      A:
        arr_min: 180
        dep_max: 360
        dwell_min: 60
    candidate_platforms:
      B: [B_p1, B_p2, B_p3]
      A: [A_p1, A_p2, A_p3]

  - id: G5060
    direction: down
    train_class: G
    priority: 1
    pass_through: false
    route:
      origin_station: B
      destination_station: A
      corridor: B_A_down
    planned:
      B:
        arr: 210
        dep: 240
      A:
        arr: 330
        dep: 390
    bounds:
      B:
        arr_min: 210
        dep_max: 360
        dwell_min: 30
      A:
        arr_min: 330
        dep_max: 510
        dwell_min: 60
    candidate_platforms:
      B: [B_p1, B_p2, B_p3]
      A: [A_p1, A_p2, A_p3]

  - id: Z386
    direction: down
    train_class: Z
    priority: 2
    pass_through: false
    route:
      origin_station: B
      destination_station: A
      corridor: B_A_down
    planned:
      B:
        arr: 330
        dep: 360
      A:
        arr: 450
        dep: 510
    bounds:
      B:
        arr_min: 330
        dep_max: 480
        dwell_min: 30
      A:
        arr_min: 450
        dep_max: 630
        dwell_min: 60
    candidate_platforms:
      B: [B_p1, B_p2, B_p3]
      A: [A_p1, A_p2, A_p3]

  - id: K1666
    direction: down
    train_class: K
    priority: 3
    pass_through: false
    route:
      origin_station: B
      destination_station: A
      corridor: B_A_down
    planned:
      B:
        arr: 450
        dep: 480
      A:
        arr: 570
        dep: 630
    bounds:
      B:
        arr_min: 450
        dep_max: 600
        dwell_min: 30
      A:
        arr_min: 570
        dep_max: 750
        dwell_min: 60
    candidate_platforms:
      B: [B_p1, B_p2, B_p3]
      A: [A_p1, A_p2, A_p3]

  # ---- Disturbance train: delayed from upstream ----
  # K999: A->B Z-class, priority 2.  Arrives at A with 60s upstream delay.
  # Window [150,220] overlaps G5050 pass-through (arr=180) on same platform.
  # Combined with corridor speed restriction, tests L2 re-scheduling.
  - id: K999
    direction: up
    train_class: Z
    priority: 2
    pass_through: false
    route:
      origin_station: A
      destination_station: B
      corridor: A_B_up
    planned:
      A:
        arr: 150
        dep: 220
      B:
        arr: 310
        dep: 340
    bounds:
      A:
        arr_min: 150
        dep_max: 340
        dwell_min: 70
      B:
        arr_min: 310
        dep_max: 460
        dwell_min: 30
    candidate_platforms:
      A: [A_p1, A_p2, A_p3]
      B: [B_p1, B_p2, B_p3]
