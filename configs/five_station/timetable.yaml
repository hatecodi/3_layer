priority_map:
  '1': 复兴号(G1380,G1616,G7629)
  '2': 和谐号(G230,G238,G2245,G1487,G1347)
  '3': 普速(K834,K1185)
station_dwell_defaults:
  A: 5
  B: 5
  C: 5
  D: 5
  E: 5
station_names:
  A: 南昌西
  B: 鹰潭北
  C: 上饶
  D: 杭州东
  E: 南京南
time_generation:
  corridor_runtime_sec:
    A_to_B: 90
    B_to_A: 90
    B_to_C: 90
    C_to_B: 90
    C_to_D: 180
    D_to_C: 180
    D_to_E: 180
    E_to_D: 180
  dep_max_slack_sec: 60
  headway_sec: 60
  visitors:
    enabled: true
    target_stations: [A, B, C, D, E]   # D included — bottleneck under pressure
    prob_per_slot: 0.5                  # more VT
    slots_per_station: [2, 3]           # 2-3 VT per station
    k_ratio: 0.6
    k_dwell: [120, 300]                 # longer occupation
    g_dwell: [60, 150]
    p1_bias: 0.0                        # uniform — heuristic can't predict
  corridor_incident:
    enabled: false                  # opt-in: pass enable_corridor_incident=True
                                    # (or --incident) so existing baselines are unchanged
    prob: 0.6
    duration_range: [100, 200]
    factor_range: [0.15, 0.4]           # 大暴雨(45km/h=0.15x) .. 暴雨(120km/h=0.4x) — HARD DATA
    safety_factor: 1.5                  # wet-rail braking distance — ESTIMATED
    min_trains: 2                       # incident window must overlap >= this many transits
    max_added_delay_sec: 200            # calibration cap — keep delay recoverable
assumptions:
- 'Time compression: real seconds / 25 = sim seconds. Base 15:00 = t=0.'
- A:南昌西 B:鹰潭北 C:上饶 D:杭州东 E:南京南
- P1:复兴号 P2:和谐号 P3:普速
- 'dep = raw_dep/25 — no dwell_min inflation, raw timetable preserved'
- 'dwell_min reduced to 5s (2 min real) — realistic minimum platform time'
- K834: single-station fixed visitor at C (arr=16:59 dep=17:04)
