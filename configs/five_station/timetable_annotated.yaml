    A: {arr_min: 242, dep_max: 526, dwell_min: 44}
  candidate_platforms: {E:[p1-p3], D:[p1,p2], C:[p1-p4], B:[p1-p3], A:[p1-p3]}

# ===========================================================================
# 关键观察:
# ===========================================================================
# 1. 始发站 A 出发间隔: G230@31, G1380@53, G1616@65, G238@79
#    → 间距仅 12-14s, 非常紧凑, 容易在A站产生始发冲突
#
# 2. 上位列车冲突 (B站):
#    G230 [108,138] ∩ G1380 [137,167] → 重叠1s
#    G1487 [126,156] ∩ G1380 [137,167] → 重叠19s
#    → B站存在真实的站台时间窗冲突
#
# 3. 部分列车 (partial trains):
#    K834:  C始发 → 前两站(A,B) arr=dep=0, 但route仍过全5站
#    G1487: C始发 → 前两站(E,D) arr=dep=0
#    K1185: B始发 → 前三站(E,D,C) arr=dep=0
#    G7629: E始发D终到 → 后三站(C,B,A) arr=dep相同(即时过)
#    G2245: E始发D终到 → 后三站同
#    G238:  A始发D终到 → E站 arr=dep=377
#    → 这些列车仍经过全5站路由, 在幽灵站浪费调度步 (B2 bug)
#
# 4. 咽喉时间未计入 (关键!) :
#    planned.arr/dep 表示"站台到达/离开", 不含物理咽喉通过时间
#    物理实际: arrival → approach(30s) → in_throat(20s) → platform → out_throat(20s)
#    每站合计 ~70s 咽喉开销未体现在时刻表中
#    → 即使零扰动, heuristic 每站晚 ~70s
#    → 337s 延迟 = 5站 × 70s ≈ 350s ✓
#
# 5. 瓶颈站: D(徐州)仅2站台, C(济南)4站台但多车停靠
