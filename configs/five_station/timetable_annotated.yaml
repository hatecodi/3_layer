# ===========================================================================
# K1185 — 快速, 部分下行 B→A, P3, 天津始发北京终到
# ===========================================================================
- id: K1185
  direction: down
  train_class: K
  priority: 3
  pass_through: false
  route:
    origin_station: B          # ★ 天津始发!
    destination_station: A
  planned:
    E: {arr: 0, dep: 0}
    D: {arr: 0, dep: 0}
    C: {arr: 0, dep: 0}
    B: {arr: 0, dep: 96}      # 天津始发
    A: {arr: 362, dep: 406}   # 北京终到  B→A走廊 90s + 天津离站96+70=166 → 262 ≠ 362
                               # 差值来自: K车速度慢, 走廊时间更长
  bounds:
    E: {arr_min: 0, dep_max: 120, dwell_min: 0}
