time_base: "00:00:00"
time_unit: seconds_after_midnight

priority_map:
  G: 1
  D: 1
  C: 1
  Z: 2
  T: 2
  K: 3

station_dwell_defaults:
  A: 600
  B: 240

assumptions:
  - Listed times are interpreted as planned controlled-section entry/exit times.
  - G5050 is marked pass-through because the user specified non-stop.
  - Other trains are treated as stopping at origin and destination control stations.
  - For origin station stopping trains, planned arrival is derived as planned departure minus dwell_min.
  - For destination station stopping trains, planned departure is derived as planned arrival plus dwell_min.

trains:
  - id: G5050
    direction: up
    train_class: G
    priority: 1
    pass_through: true
    route:
      origin_station: A
      destination_station: B
      corridor: A_B_up
    planned:
      A:
        arr: 25560   # 07:06
        dep: 25560
      B:
        arr: 30960   # 08:36
        dep: 30960
    bounds:
      A:
        arr_min: 25560
        dep_max: 26160
        dwell_min: 0
      B:
        arr_min: 30960
        dep_max: 31560
        dwell_min: 0
    candidate_platforms:
      A: [A_p1, A_p2, A_p3]
      B: [B_p1, B_p2, B_p3]

